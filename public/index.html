<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regulament Vipuri Roleplay - Portal Oficial</title>
  <link rel="stylesheet" href="styles.css?v=3">
  <style>
    .main-content {
      grid-template-columns: 1fr !important;
    }
    .main-content.has-toc {
      grid-template-columns: 1fr 280px !important;
    }
  </style>
</head>
<body>

  <!-- Glowing Background Effects -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <!-- Header Navigation -->
  <header id="mainHeader">
    <div class="header-container">
      <a href="/" class="logo-area">
        <img src="assets/logo.png" alt="Vipuri Logo" class="logo-img" onerror="this.src='https://i.imgur.com/Kz7l3zL.png';">
        <div class="logo-text-container">
          <span class="logo-title">Vipuri</span>
          <span class="logo-subtitle">Roleplay</span>
        </div>
      </a>

      <!-- Categories Selector -->
      <nav class="nav-categories" id="categoriesNav">
        <!-- populated dynamically -->
        <button class="category-tab" data-category="general">Regulament General</button>
        <button class="category-tab" data-category="sanctiuni">Sancțiuni</button>
        <button class="category-tab" data-category="pd">Poliție</button>
        <button class="category-tab" data-category="smurd">SMURD</button>
        <button class="category-tab" data-category="mafii">Mafii</button>
        <button class="category-tab" data-category="cod-penal">Cod Penal</button>
        <button class="category-tab" data-category="lideri">Lideri</button>
        <button class="category-tab" data-category="applications">Aplicații</button>
      </nav>

      <div class="header-actions" id="headerActions">
        <button class="btn-primary" id="openAuthBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Portal Staff
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="hero" id="heroSection">
    <h1 class="hero-title-glowing">Portal Regulamente <span>VIPURI</span></h1>
    <p class="hero-subtitle">Citește regulamentul oficial al serverului, caută sancțiunile specifice sau trimite o aplicație pentru facțiuni.</p>
    
    <!-- Search Bar -->
    <div class="search-wrapper">
      <div class="search-input-container">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="search-input" id="rulesSearch" placeholder="Caută o regulă sau o sancțiune (ex: metagaming, ban)...">
        <span class="search-shortcut">CTRL + K</span>
      </div>
      <!-- Search dropdown -->
      <div class="search-results-dropdown" id="searchResults"></div>
    </div>
  </section>

  <!-- Main Content Grid -->
  <main class="main-content">
    
    <!-- Collapsible Sidebar Navigation -->
    <aside class="sidebar-nav" style="display: none;">
      <h3 class="sidebar-title">Capitole & Articole</h3>
      <ul class="chapters-list" id="chaptersList">
        <!-- populated dynamically -->
      </ul>
    </aside>

    <!-- Main Content Area -->
    <section class="content-area" style="max-width: 1000px; margin: 0 auto; width: 100%;">
      <div class="rules-container" id="rulesContainer">
        <!-- populated dynamically -->
        <div class="rules-empty-state">
          <h3>Se încarcă regulamentele...</h3>
          <p>Te rugăm să aștepți câteva secunde.</p>
        </div>
      </div>
    </section>

    <!-- Right Sidebar (TOC) -->
    <aside class="toc-sidebar" id="tocSidebar">
      <h3 class="toc-title">Pe pagina asta</h3>
      <ul class="toc-list" id="tocList">
        <!-- populated dynamically -->
      </ul>
    </aside>
  </main>

  <!-- Auth Modal -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-card">
      <button class="modal-close" id="closeAuthBtn">&times;</button>
      <div class="modal-tabs">
        <button class="modal-tab-btn active" data-tab="login">Autentificare</button>
        <button class="modal-tab-btn" data-tab="register">Înregistrare</button>
      </div>

      <!-- Login Form -->
      <form class="auth-form active" id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginUsername">Nume Utilizator</label>
          <input type="text" class="form-input" id="loginUsername" placeholder="Introdu username..." required>
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">Parolă</label>
          <input type="password" class="form-input" id="loginPassword" placeholder="Parola ta" required>
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.75rem; cursor: pointer;">
          <input type="checkbox" id="loginRememberMe" style="width: 16px; height: 16px; cursor: pointer; accent-color: var(--primary);">
          <label for="loginRememberMe" style="color: var(--text-light); font-size: 0.85rem; cursor: pointer; user-select: none;">Ține-mă logat (7 zile)</label>
        </div>
        <button type="submit" class="btn-primary" style="justify-content: center; margin-top: 1rem;">Conectare</button>
      </form>

      <!-- Register Form -->
      <form class="auth-form" id="registerForm">
        <div class="form-group">
          <label class="form-label" for="regUsername">Nume Utilizator (Username unic)</label>
          <input type="text" class="form-input" id="regUsername" placeholder="Alege un username..." required>
        </div>
        <div class="form-group">
          <label class="form-label" for="regFullName">Nume și Prenume (Nume real/RP)</label>
          <input type="text" class="form-input" id="regFullName" placeholder="Numele tău complet..." required>
        </div>
        <div class="form-group">
          <label class="form-label" for="regDiscord">Discord User ID sau Nume</label>
          <input type="text" class="form-input" id="regDiscord" placeholder="Nume utilizator Discord..." required>
        </div>
        <div class="form-group">
          <label class="form-label" for="regPassword">Parolă</label>
          <input type="password" class="form-input" id="regPassword" placeholder="Creează o parolă puternică" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="regRole">Rol Solicitat</label>
          <select class="form-select" id="regRole" required>
            <option value="admin" selected>Admin (Vizualizare Aplicații & Reg)</option>
            <option value="manager">Manager Staff (Management General)</option>
            <option value="tester-pd">Tester PD (Gestiune Aplicații Poliție)</option>
            <option value="tester-smurd">Tester SMURD (Gestiune Aplicații SMURD)</option>
            <option value="tester-staff">Tester Staff (Gestiune Aplicații Staff)</option>
            <option value="manager-mafii">Manager Mafii / Gang (Gestiune Cereri Gang)</option>
          </select>
        </div>
        <button type="submit" class="btn-primary" style="justify-content: center; margin-top: 0.5rem;">Trmite Cererea</button>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js?v=3"></script>
</body>
</html>
